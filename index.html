<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TEST</title>
</head>
<body style="background:#060606; color:#ffffff; font-family:Arial, sans-serif; padding:40px;">

  <h1 style="color:#4ADE29; font-size:32px;">TEST 1 — HTML funciona</h1>
  <p style="font-size:18px;">Si ves este texto en blanco sobre negro, el HTML carga bien.</p>

  <hr style="border-color:#333; margin:30px 0;">

  <h2 style="color:#4ADE29; font-size:24px;">TEST 2 — JavaScript</h2>
  <p id="js-test" style="font-size:18px; color:#ff4040;">JavaScript NO está funcionando</p>

  <hr style="border-color:#333; margin:30px 0;">

  <h2 style="color:#4ADE29; font-size:24px;">TEST 3 — Librería Supabase</h2>
  <p id="sb-test" style="font-size:18px; color:#888;">Verificando...</p>

  <hr style="border-color:#333; margin:30px 0;">

  <h2 style="color:#4ADE29; font-size:24px;">TEST 4 — Conexión a la base</h2>
  <p id="db-test" style="font-size:18px; color:#888;">Verificando...</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // TEST 2
  document.getElementById('js-test').textContent = 'JavaScript funciona correctamente';
  document.getElementById('js-test').style.color = '#4ADE29';

  // TEST 3
  var sbTest = document.getElementById('sb-test');
  if (typeof supabase === 'undefined') {
    sbTest.textContent = 'ERROR: la librería de Supabase NO cargó (puede ser un bloqueador de anuncios)';
    sbTest.style.color = '#ff4040';
  } else {
    sbTest.textContent = 'Librería de Supabase cargada correctamente';
    sbTest.style.color = '#4ADE29';

    // TEST 4
    var dbTest = document.getElementById('db-test');
    try {
      var sb = supabase.createClient(
        'https://uyujekukxtpcmwihugfs.supabase.co',
        'sb_publishable_sKFFRjTjsu9vuMjfF7uJBg_VZ2IcNvO'
      );
      sb.from('admins').select('email').limit(1).then(function(res) {
        if (res.error) {
          dbTest.textContent = 'Conectó pero dio error: ' + res.error.message;
          dbTest.style.color = '#ff8c00';
        } else {
          dbTest.textContent = 'Conexión a la base EXITOSA';
          dbTest.style.color = '#4ADE29';
        }
      }).catch(function(e) {
        dbTest.textContent = 'Error de conexión: ' + e.message;
        dbTest.style.color = '#ff4040';
      });
    } catch (e) {
      dbTest.textContent = 'Error creando cliente: ' + e.message;
      dbTest.style.color = '#ff4040';
    }
  }
</script>

</body>
</html>
